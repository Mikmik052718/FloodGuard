<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3-Way Smooth Switch Button</title>
  <style>
    :root{
      --bg:#0f1724;
      --accent:#7c3aed;
      --accent-2:#06b6d4;
      --accent-3:#22c55e;
      --muted:#9aa4b2;
      font-family: Inter, sans-serif;
      color-scheme: dark;
    }
    body{margin:0;display:grid;place-items:center;height:100vh;background:linear-gradient(180deg,#071025,#071723);color:#e6eef6}
    .container{background:rgba(255,255,255,0.03);padding:24px;border-radius:16px;width:90%;max-width:700px;box-shadow:0 10px 30px rgba(0,0,0,0.4)}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .switch-btn{
      --w:180px;--h:44px;
      position:relative;width:var(--w);height:var(--h);background:rgba(255,255,255,0.05);border-radius:999px;display:flex;align-items:center;justify-content:space-between;padding:4px;cursor:pointer;user-select:none;transition:transform .2s ease;
    }
    .switch-btn:active{transform:scale(.98)}
    .switch-labels{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:13px;color:var(--muted);z-index:2;padding:0 10px}
    .switch-knob{position:absolute;top:4px;left:4px;width:calc((var(--w)/3) - 8px);height:calc(var(--h) - 8px);border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:left .45s cubic-bezier(.22,.9,.2,1), background .45s ease;}
    .switch-btn[data-pos="2"] .switch-knob{left:calc((var(--w)/3));background:linear-gradient(90deg,var(--accent-2),var(--accent-3));}
    .switch-btn[data-pos="3"] .switch-knob{left:calc((var(--w)/3)*2);background:linear-gradient(90deg,var(--accent-3),var(--accent));}
    .switch-btn[data-pos="1"] .label-1{color:#fff}
    .switch-btn[data-pos="2"] .label-2{color:#fff}
    .switch-btn[data-pos="3"] .label-3{color:#fff}
    .pages{position:relative;height:300px;background:rgba(255,255,255,0.02);border-radius:12px;overflow:hidden;padding:16px}
    .page{position:absolute;inset:0;padding:20px;transition:transform .6s cubic-bezier(.22,.9,.2,1), opacity .4s ease;opacity:0;transform:translateX(40px);}
    .pages.show-1 .page-1{opacity:1;transform:translateX(0);z-index:2}
    .pages.show-2 .page-2{opacity:1;transform:translateX(0);z-index:2}
    .pages.show-3 .page-3{opacity:1;transform:translateX(0);z-index:2}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>3-Way Smooth Page Switch</h2>
      <div class="switch-btn" id="switch" data-pos="1" tabindex="0">
        <div class="switch-knob"></div>
        <div class="switch-labels">
          <span class="label-1">Page 1</span>
          <span class="label-2">Page 2</span>
          <span class="label-3">Page 3</span>
        </div>
      </div>
    </div>
    <div class="pages show-1" id="pages">
      <div class="page page-1">
        <h3>Welcome to Page 1</h3>
        <p>This is the first page. Click the switch to go to Page 2 or Page 3.</p>
      </div>
      <div class="page page-2">
        <h3>You're on Page 2</h3>
        <p>Use the switch to explore Page 1 or Page 3.</p>
      </div>
      <div class="page page-3">
        <h3>Now on Page 3</h3>
        <p>This is the final page. The switch cycles between three views smoothly.</p>
      </div>
    </div>
  </div>
  <script>
    const switchBtn = document.getElementById('switch');
    const pages = document.getElementById('pages');
    function setPage(pos){
      switchBtn.setAttribute('data-pos',pos);
      pages.className = 'pages show-' + pos;
    }
    function nextPage(){
      let pos = parseInt(switchBtn.getAttribute('data-pos'));
      pos = pos >= 3 ? 1 : pos + 1;
      setPage(pos);
    }
    switchBtn.addEventListener('click', nextPage);
    switchBtn.addEventListener('keydown', (e)=>{
      if(e.key===' '||e.key==='Enter'){e.preventDefault();nextPage();}
    });
  </script>
</body>
</html>
